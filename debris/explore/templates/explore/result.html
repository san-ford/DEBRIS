<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Search Result</title>
    <style>
    .grid-container {
      display: grid;
      grid-template-columns: auto auto auto auto auto;
      align-content: center;
    }
  </style>
</head>
<body>
    <h1>Your item:</h1>
    <img src="{{ image_submitted }}" width="200">

    <h1>Related items:</h1>
    <div class="grid-container">
    {% if related_images %}
        {% for each in related_images %}
            {% if each %}
                <div class="grid-item">
                <form action="{% url 'result' %}" method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input type="hidden" name="selection" value="{{ each.encoded_image }}">
                    <input type="hidden" name="embeddings" value="{{ each.embeddings }}">
                    <input type="hidden" name="node" value="{{ each.node }}">
                    <input type="hidden" name="database" value="{{ database }}">
                    <img src="{{ each.encoded_image }}" width="200">
                    <br>
                    <input type="submit" value="Search with this image">
                    <p>
                </form>
                </div>
            {% endif %}
        {% endfor %}
    {% else %}
        No related items found.
    {% endif %}
    </div>

    <p>
    <form action="{% url 'index' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <button type="submit">Return to index page</button>
    </form>
    <form action="{% url 'upload' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="hidden" name="database" value="{{ database }}">
        <input type="hidden" name="db_created" value=True>
        <button type="submit">Search with a new image</button>
    </form>

</body>
</html>
